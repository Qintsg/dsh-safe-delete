name: 功能建议
description: 为 dsh-safe-delete 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你希望实现的功能。
  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 你希望解决什么问题？当前方案有哪些不便之处？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的行为、接口或配置方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其他方案？
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 其他任何相关的上下文、示例或参考资料。
